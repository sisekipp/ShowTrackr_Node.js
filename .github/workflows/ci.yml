name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/showtrackr
          AUTH_SECRET: ci-secret
          AUTH_TRUST_HOST: true
          TVDB_API_KEY: ci-dummy
